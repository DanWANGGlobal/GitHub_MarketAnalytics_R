name: R Analysis Pipeline

on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'input/**'
      - 'MarketAnalytics_cloud.R'
      - '.github/workflows/**'

env:
  WORK_DIR: ${{ github.workspace }}
  # 可选：坚果云配置（如果保留）
  NUTSTORE_USER: ${{ secrets.NUTSTORE_USER }}
  NUTSTORE_PASSWORD: ${{ secrets.NUTSTORE_PASSWORD }}
  NUTSTORE_WEBDAV_URL: ${{ secrets.NUTSTORE_WEBDAV_URL }}
  NUTSTORE_REMOTE_PATH: ${{ secrets.NUTSTORE_REMOTE_PATH }}
  # Google Drive配置
  GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
  GDRIVE_FOLDER_NAME: ${{ secrets.GDRIVE_FOLDER_NAME }}

jobs:
  r-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'
        
    - name: Cache R Packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/R
          ~/R/x86_64-pc-linux-gnu-library
        key: r-packages-${{ hashFiles('**/MarketAnalytics_cloud.R') }}
        restore-keys: |
          r-packages-
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          libfreetype6-dev \
          libpng-dev \
          libtiff5-dev \
          libjpeg-dev \
          libfontconfig1-dev
          
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python Dependencies
      run: |
        pip install webdav4 requests
        # Google Drive依赖（可选）
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
        
    - name: Run R Analysis
      run: |
        Rscript MarketAnalytics_cloud.R
      timeout-minutes: 60
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: analysis-output-${{ github.run_id }}
        path: |
          output/*.xlsx
          output/*.csv
          output/analysis.log
          output/dataAnalysis/*.xlsx
          output/charting/*.png
          output/charting/*.pdf
        retention-days: 7
        
    - name: Sync to Nutstore (if configured)
      if: env.NUTSTORE_USER != '' && env.NUTSTORE_PASSWORD != ''
      continue-on-error: true  # 坚果云失败不阻塞流程
      run: |
        python scripts/nutstore_sync.py
        
    - name: Sync to Google Drive (if configured)
      if: env.GOOGLE_CREDENTIALS_B64 != ''
      continue-on-error: true
      run: |
        python scripts/gdrive_sync.py
