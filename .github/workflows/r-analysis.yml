name: R Analysis Pipeline

on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'input/**'
      - 'MarketAnalytics_cloud.R'
      - '.github/workflows/**'

env:
  WORK_DIR: ${{ github.workspace }}
  NUTSTORE_USER: ${{ secrets.NUTSTORE_USER }}
  NUTSTORE_PASSWORD: ${{ secrets.NUTSTORE_PASSWORD }}
  NUTSTORE_WEBDAV_URL: ${{ secrets.NUTSTORE_WEBDAV_URL }}
  NUTSTORE_REMOTE_PATH: ${{ secrets.NUTSTORE_REMOTE_PATH }}

jobs:
  r-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          libfreetype6-dev \
          libpng-dev \
          libtiff5-dev \
          libjpeg-dev
          
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python Dependencies
      run: |
        pip install webdav4 requests
        
    - name: Run R Analysis
      run: |
        Rscript MarketAnalytics_cloud.R
      timeout-minutes: 60
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: analysis-output-${{ github.run_id }}
        path: |
          output/*.xlsx
          output/*.csv
          output/analysis.log
          output/dataAnalysis/*.xlsx
          output/charting/**/*.html
        retention-days: 7
        
    - name: Sync to Nutstore
      if: env.NUTSTORE_USER != '' && env.NUTSTORE_PASSWORD != ''
      run: |
        python scripts/nutstore_sync.py
